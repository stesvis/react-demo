name: CI/CD Pipeline

on:
  workflow_dispatch: {}
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile.staging
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/metagolf.demo.staging:latest
          build-args: |
            PACKAGES_TOKEN_GITHUB=${{ secrets.PACKAGES_TOKEN_GITHUB }}
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN_GITHUB }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          mkdir -p /var/lib/metagolf-demo-staging/logs
          chmod -R 777 /var/lib/metagolf-demo-staging/logs
          cd ~/metagolf-demo-staging
          docker pull ${{ secrets.DOCKER_USERNAME }}/metagolf.demo.staging:latest
          docker compose -f docker-compose.yml -f docker-compose.staging.yml down
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
